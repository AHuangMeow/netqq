[package]
name = "netqq"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = "0.4"
eframe = "0.36"
egui = "0.36"

# Windows 上用系统自带的 SChannel，省去 aws-lc 的 C 交叉编译
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "charset",
  "http2",
  "native-tls",
  "system-proxy",
] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", features = ["blocking"] }

# 开发构建也保持可用的响应速度
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
